apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-30080
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: nginx-30080
  template:
    metadata:
      labels:
        app: nginx-30080
    spec:
      containers:
        - name: nginx
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 30080
          livenessProbe:
            httpGet:
              path: /
              port: 30080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 30080
            initialDelaySeconds: 5
            periodSeconds: 5
